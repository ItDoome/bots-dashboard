# /etc/nginx/sites-available/doomedash.com
# HTTP-only origin config for Cloudflare Proxy (Flexible SSL).
#
# Traffic path:
#     Browser ──https──> Cloudflare ──http──> nginx :80 ──http──> uvicorn :8090
#
# Port 443 on this host is owned by xray-linux-amd64 (x-ui VLESS+Reality
# masquerading as dropbox.com) — it cannot be shared. Instead Cloudflare
# terminates TLS at its edge and forwards plain HTTP to us on 80.
#
# For this to work:
#   1. CF dashboard → DNS → doomedash.com = Proxied (orange cloud)
#   2. CF dashboard → SSL/TLS → overview → Flexible
#
# Since CF→origin is plain HTTP on port 80, we trust the
# X-Forwarded-Proto, X-Forwarded-For and CF-Connecting-IP headers that
# Cloudflare injects, and feed them to the FastAPI app so that:
#   - FastAPI sees request.url.scheme == "https"
#   - Secure cookies get set on the way back
#   - access logs carry the real client IP

# Cloudflare IPv4 ranges — trust these so real_ip_header works.
# Keep the list in sync with https://www.cloudflare.com/ips-v4/ if it changes.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    listen [::]:80;
    server_name doomedash.com www.doomedash.com;

    client_max_body_size 2m;

    # These headers DO NOT replace Cloudflare's edge-side security — they
    # provide defence in depth on the origin response.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/bots-dashboard;
    index index.html;

    # TG login callback — don't log the query string (it carries auth tokens).
    location = /api/auth/telegram {
        access_log off;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Trust CF's X-Forwarded-Proto if present; otherwise default to https
        # (we only serve via CF in this setup anyway).
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-store" always;
    }

    location ~* ^/assets/.*\.(js|css|woff2|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
