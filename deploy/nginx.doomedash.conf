# /etc/nginx/sites-available/doomedash.com
# Symlink into /etc/nginx/sites-enabled/ and reload nginx to activate.
# TLS certs are provisioned separately via `certbot --nginx -d doomedash.com -d www.doomedash.com`.

# ─────────────────────────────────────────────────────────────
# HTTP → HTTPS redirect (both naked + www)
# ─────────────────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name doomedash.com www.doomedash.com;

    # Let's Encrypt renewal webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://doomedash.com$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────
# HTTPS: www → naked redirect
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.doomedash.com;

    ssl_certificate     /etc/letsencrypt/live/doomedash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doomedash.com/privkey.pem;

    return 301 https://doomedash.com$request_uri;
}

# ─────────────────────────────────────────────────────────────
# HTTPS: canonical
# ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doomedash.com;

    ssl_certificate     /etc/letsencrypt/live/doomedash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doomedash.com/privkey.pem;

    # Modern TLS defaults — certbot's include file pulls in good ciphers,
    # but we pin HSTS and a few other headers explicitly.
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    client_max_body_size 2m;

    # Static bundle — served directly
    root /var/www/bots-dashboard;
    index index.html;

    # ─────────────────────────────────────────────────────
    # TG login callback — GET with sensitive query params.
    # CRITICAL: access_log off so auth tokens don't land in logs.
    # ─────────────────────────────────────────────────────
    location = /api/auth/telegram {
        access_log off;

        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 15s;
    }

    # ─────────────────────────────────────────────────────
    # API proxy
    # ─────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
        proxy_connect_timeout 5s;
        proxy_buffering on;

        # Don't cache API responses at the proxy layer.
        add_header Cache-Control "no-store" always;
    }

    # ─────────────────────────────────────────────────────
    # Cache-busting for JS/CSS — vite's fingerprinted assets
    # ─────────────────────────────────────────────────────
    location ~* ^/assets/.*\.(js|css|woff2|svg|png|jpg|jpeg|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ─────────────────────────────────────────────────────
    # SPA fallback — everything else goes to index.html so
    # react-router can handle client-side routing.
    # ─────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # Security: hide dotfiles (e.g. .git if anything leaks in)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
